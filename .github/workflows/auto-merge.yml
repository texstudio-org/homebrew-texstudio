# based on https://github.com/TeX-Live/setup-texlive-action/blob/main/.github/workflows/dependabot.yml
name: auto merge PR

on:
  workflow_run:
    workflows: ['brew test-bot']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(
        fromJSON('["github-actions[bot]", "dependabot[bot]"]'),
        github.event.sender.login
      )
    steps:
      - name: Try to merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        # gh docs: https://cli.github.com/manual/gh_pr_merge
        run: >-
          gh pr merge --squash --delete-branch "${PR}"
