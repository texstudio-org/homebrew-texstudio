# based on https://github.com/TeX-Live/setup-texlive-action/blob/main/.github/workflows/dependabot.yml
name: auto merge

on:
  workflow_run:
    workflows: ['brew test-bot']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # for PRs created by `brew bump` (see `autobump.yml`), due to PAT
    # HOMEBREW_GITHUB_API_TOKEN, the event sender becomes a non-bot user
    # so we use a looser condition: check the name prefix of head branch
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.sender.login == 'dependabot[bot]' || 
        startsWith(github.event.workflow_run.head_branch, 'bump-texstudio')
      )

    steps:
      - name: Dump event payload
        if: runner.debug == '1'
        env:
          EVENT: ${{ toJSON(github.event) }}
        run:
          echo "$EVENT"

      - name: Try to merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        # gh docs https://cli.github.com/manual/gh_pr_merge
        run: >-
          gh pr merge --auto --squash --delete-branch "${PR}"
