# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 11:30 UTC
    - cron: 30 11 * * *
  # NOTE: added `workflow_dispatch` event for debugging
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    # NOTE: bumping macOS-only casks needs to run on macOS
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        # NOTE: option `--full-name` is needed to avoid resolving to the same
        # named cask in core `Homebrew/cask` tap
        # see https://github.com/orgs/Homebrew/discussions/7015#discussioncomment-18056484
        # `brew bump` https://docs.brew.sh/Manpage#bump-options-formulacask-
        run: brew bump --no-fork --open-pr --casks --full-name --tap="$TAP_NAME"
